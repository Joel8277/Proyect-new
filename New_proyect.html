<body>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="hint">Flechas/WASD mover · Z aceptar · X menú · C volver / dash</div>
</div>
<div id="ui" role="dialog" aria-live="polite"></div>
<div id="rot"><i></i><p id="rotp"></p></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
/* RIUMAN Y LOS 5 REINOS — Metroidvania por turnos */
(function(){
"use strict";

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const TILE = 40;
ctx.imageSmoothingEnabled = false;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.floor(Math.random()*(b-a+1));

let actx = null;
function beep(freq,dur,type,vol){
  type = type || 'square'; vol = (vol || 0.05) * S.vol;
  if(S.mute || !S.sfx || vol <= 0) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* ---------------- ESTADO GLOBAL ---------------- */
const G = {
  scene:'title',
  prevScene:'desert',
  camX:0, camY:0,
  dialog:null,
  toast:null, toastT:0,
  t:0
};

const player = {
  hp:30,maxHp:30,atk:6,def:3,level:1,xp:0,xpNext:20,potions:3,rp:[0,0,0,0,0],
  lives:3, maxLives:5,
  abilities:{sword:false}
};

const keys = {};
/* ---------------- DIÁLOGOS Y AVISOS ---------------- */
function showDialog(lines, after){
  G.dialog = { lines:lines, idx:0, after:after };
  G.prevScene = G.scene;
  G.scene = 'dialog';
}
function advanceDialog(){
  const d = G.dialog;
  if(!d) return;
  d.idx++;
  beep(600,0.03,'square',0.02);
  if(d.idx >= d.lines.length){
    const after = d.after;
    G.dialog = null;
    G.scene = G.prevScene;
    if(after) after();
  }
}
function toast(txt){
  G.toast = txt;
  G.toastT = 2.2;
}

/* ---------------- COMBATE ---------------- */
const battle = {
  enemy:null, ent:null,
  phase:'menu',
  sel:0, msg:'', timer:0, pending:null,
  defend:false, enemyShake:0, playerShake:0, hitFlash:0,
  slash:0, aim:null, aimDone:false, aimMult:1, aimTxt:''
};

const MENU = ['Atacar','Defender','Poción','Huir'];

function startBattle(ent){
  const d = ent.def;
  const q = DIFF[G.diff] || DIFF.med, sc = (v,m)=> Math.max(1, Math.round(v*m));
  battle.enemy = { name:d.name, hp:sc(d.hp,q.hp), maxHp:sc(d.hp,q.hp), atk:sc(d.atk,q.atk), def:sc(d.def,q.def), xp:sc(d.xp,q.xp), color:d.color, shape:d.shape };
  battle.ent = ent;
  battle.phase = 'menu';
  battle.sel = 0;
  battle.defend = false;
  battle.enemyShake = 0;
  battle.playerShake = 0;
  battle.hitFlash = 0;
  battle.pending = null; battle.slash = 0; battle.aimDone = false;
  battle.msg = '¡' + d.name + ' aparece!';
  G.scene = 'battle';
  beep(260, 0.2, 'square', 0.06);
}

function setMsg(text, time, next){
  battle.msg = text;
  battle.phase = 'msg';
  battle.timer = time;
  battle.pending = next || null;
}

function startAim(){
  const sp = {easy:1.2,med:1.5,hard:1.9,ext:2.3}[G.diff] || 1.5;
  battle.aim = {p:0, sp:sp, dir:1}; battle.phase = 'aim'; battle.msg = '¡Pulsa Z cuando la barra esté en el centro!';
}
function endAim(){
  const a = battle.aim; let m, tx;
  if(a.p >= 1){ m = 0.3; tx = '¡Fallaste! '; }
  else { const d = Math.abs(a.p - 0.5) * 2;
    if(d <= 0.09){ m = 1.5; tx = '¡PERFECTO! '; } else { m = 1.2 - d*0.8; tx = m >= 0.9 ? '¡Buen golpe! ' : 'Golpe débil. '; } }
  battle.aimMult = m; battle.aimTxt = tx; battle.aimDone = true; chooseAction(0);
}
function battleKey(code){
  if(battle.phase === 'aim'){ if(code==='Enter' || code==='KeyZ' || code==='Space') endAim(); return; }
  if(battle.phase !== 'menu') return;
  if(code==='ArrowLeft' || code==='KeyA'){ battle.sel = (battle.sel+3)%4; beep(420,0.03,'square',0.02); }
  if(code==='ArrowRight'|| code==='KeyD'){ battle.sel = (battle.sel+1)%4; beep(420,0.03,'square',0.02); }
  if(code==='Enter' || code==='KeyZ' || code==='Space'){ chooseAction(battle.sel); }
}

function chooseAction(i){
  const e = battle.enemy;

  if(i === 0){
    if(!battle.aimDone){ startAim(); return; }
    battle.aimDone = false;
    let dmg = Math.max(1, player.atk + rnd(0,4) - e.def);
    if(player.abilities.sword){
      dmg = Math.floor(dmg * 1.6) + 4;
    }
    let crit = false;
    if(Math.random() < critChance()){ dmg = Math.floor(dmg*1.8); crit = true; }
    dmg = Math.max(1, Math.round(dmg * (DIFF[G.diff] || DIFF.med).out));
    dmg = Math.max(1, Math.round(dmg * battle.aimMult * (1 + G.buff.atk) * 0.65 * (1 - 0.07*G.dz.ins)));
    e.hp = Math.max(0, e.hp - dmg);
    battle.enemyShake = 14;
    battle.hitFlash = 0.3; battle.slash = 0.3; battle.critFx = crit; battle.critT = crit ? 1.0 : 0;
    beep(crit?880:520, 0.09, 'square', 0.05);
    const weapon = player.abilities.sword ? 'la Espada Maestra' : (player.eq >= 0 ? WEAPONS[player.bag[player.eq]].name : 'su puño');
    setMsg(battle.aimTxt + (crit?'¡CRÍTICO! ':'') + 'Riuman ataca con ' + weapon + '. ¡' + dmg + ' de daño!', 1.0, ()=>{
      if(e.hp <= 0){ winBattle(); }
      else { enemyTurn(); }
    });
    return;
  }

  if(i === 1){
    battle.defend = true;
    const heal = Math.min(4, player.maxHp - player.hp);
    if(heal > 0) player.hp += heal;
    beep(330,0.12,'sine',0.04);
    setMsg('Riuman se defiende' + (heal>0?` y recupera ${heal} PV.`:'.'), 0.9, ()=>{ enemyTurn(); });
    return;
  }

  if(i === 2){
    const pk = pickPot();
    if(pk < 0){
      setMsg('¡No te quedan pociones!', 0.9, ()=>{ battle.phase='menu'; battle.msg='¿Qué hará Riuman?'; });
      return;
    }
    usePot(pk); applyFx(pk);
    const heal = Math.min(POTS[pk].heal, player.maxHp - player.hp);
    player.hp += heal;
    beep(700,0.12,'sine',0.05);
    setMsg('Riuman bebe una poción ' + POTS[pk].n + '. ¡Recupera ' + heal + ' PV! (' + POTS[pk].fn + ')', 1.0, ()=>{ enemyTurn(); });
    return;
  }

  if(i === 3){
    if(Math.random() < 0.6){
      beep(300,0.15,'sine',0.04);
      setMsg('¡Escapaste con éxito!', 0.8, ()=>{
        if(battle.ent){ battle.ent.cooldown = 100; }
        G.scene = 'desert';
      });
    } else {
      setMsg('¡No pudiste escapar!', 0.9, ()=>{ enemyTurn(); });
    }
    return;
  }
}

function enemyTurn(){
  const e = battle.enemy;
  let dmg = Math.max(1, e.atk + rnd(0,3) - player.def);
  dmg = Math.max(1, Math.round(dmg * (DIFF[G.diff] || DIFF.med).inn));
  dmg = Math.max(1, Math.round(dmg * (1 - G.buff.red)));
  dmg = Math.max(1, Math.round(dmg * (1 + 0.07*G.dz.ins)));
  if(battle.defend) dmg = Math.max(1, Math.floor(dmg/2));
  player.hp = Math.max(0, player.hp - dmg);
  battle.playerShake = 14;
  beep(160, 0.13, 'sawtooth', 0.05);

/* ===== CONTINUACIÓN: pega esto justo donde se cortó el código (reemplaza desde la línea "let txt = e.name..." hasta el final) ===== */
  let txt = e.name + ' ataca. ¡' + dmg + ' de daño!';
  if(battle.defend) txt += ' (Te defendiste)';
  battle.defend = false;
  setMsg(txt, 1.0, ()=>{
    if(player.hp <= 0){ loseLife(); }
    else { tickBuff(); battle.phase='menu'; battle.msg='¿Qué hará Riuman?'; }
  });
}

function winBattle(){
  const e = battle.enemy, ent = battle.ent;
  if(ent) ent.alive = false;
  player.xp += e.xp;
  G.dz.zk += (ent === D.boss ? 80 : rnd(2,5)); matDrop(ent);
  beep(784,0.12,'square',0.06);
  let txt = '¡' + e.name + ' derrotado! +' + e.xp + ' XP.';
  let up = false;
  while(player.xp >= player.xpNext){
    player.xp -= player.xpNext; player.level++;
    player.xpNext = Math.floor(player.xpNext*1.5);
    player.maxHp += 6; player.hp = player.maxHp;
    player.atk += 2; player.def += 1; up = true;
  }
  if(up) txt += ' ¡Nivel ' + player.level + '!';
  setMsg(txt, 1.8, ()=>{ G.scene = 'desert'; });
}

function loseLife(){
  player.lives--;
  if(player.lives <= 0){ G.scene = 'gameover'; beep(100,0.5,'sawtooth',0.06); return; }
  player.hp = player.maxHp;
  if(battle.ent) battle.ent.cooldown = 150;
  toast('Pierdes una vida... (' + player.lives + ' restantes)');
  dp.x = D.sx; dp.y = D.sy; dp.inv = 90; G.scene = 'desert';
}

function resetGame(){
  Object.assign(player,{hp:30,maxHp:30,atk:6,def:3,level:1,xp:0,xpNext:20,potions:3,rp:[0,0,0,0,0],lives:3,
    abilities:{sword:false}});
  loadDesert();
  G.scene = 'desert';
}

/* ---------------- ACTUALIZACIÓN GENERAL ---------------- */
function update(dt){
  if(G.toastT > 0) G.toastT -= dt;
  if(G.scene === 'desert'){ updateDesert(dt); return; }
  if(G.scene === 'fall'){ updateFall(dt);
  } else if(G.scene === 'sleep'){ updateSleep(dt);
  } else if(G.scene === 'boil'){ updateBoil(dt);
  } else if(G.scene === 'battle'){
    if(battle.enemyShake > 0) battle.enemyShake--;
    if(battle.playerShake > 0) battle.playerShake--;
    if(battle.hitFlash > 0) battle.hitFlash -= dt;
    if(battle.slash > 0) battle.slash -= dt;
    if(battle.critT > 0) battle.critT -= dt;
    if(battle.phase === 'aim'){ const a = battle.aim; a.p += a.dir * a.sp * dt; if(a.p >= 1){ a.p = 1; a.dir = -1; } else if(a.p <= 0){ a.p = 0; a.dir = 1; } }
    if(battle.phase === 'msg'){
      battle.timer -= dt;
      if(battle.timer <= 0){
        const n = battle.pending; battle.pending = null;
        if(n) n(); else battle.phase = 'menu';
      }
    }
  }
}

/* ---------------- DIBUJO: UTILIDADES ---------------- */
function txt(s,x,y,size,color,align){
  ctx.font = 'bold ' + size + 'px "Courier New",monospace';
  ctx.fillStyle = color || '#fff';
  ctx.textAlign = align || 'left';
  ctx.fillText(s,x,y);
}
function panel(x,y,w,h){
  ctx.fillStyle = 'rgba(10,10,30,0.88)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = '#e8e8ff'; ctx.lineWidth = 3; ctx.strokeRect(x,y,w,h);
}
function bar(x,y,w,h,v,max,color){
  ctx.fillStyle = '#222'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = color; ctx.fillRect(x,y,w*clamp(v/max,0,1),h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x,y,w,h);
}
function circ(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function eyes(a,b,y,r,p){
  circ(a,y,r,'#fff'); circ(b,y,r,'#fff');
  circ(a+1,y,r/2,p||'#111'); circ(b+1,y,r/2,p||'#111');
}

function drawMonster(shape,color,t){
  ctx.fillStyle = color;
  if(shape === 'slime'){
    ctx.beginPath(); ctx.arc(20,32,17,Math.PI,0); ctx.lineTo(37,38); ctx.lineTo(3,38); ctx.closePath(); ctx.fill();
    eyes(14,26,27+Math.sin(t*3),4);
  } else if(shape === 'bug'){
    ctx.beginPath(); ctx.ellipse(20,26,16,11,0,0,6.2832); ctx.fill();
    for(let i=0;i<4;i++) ctx.fillRect(6+i*9,34,3,5);
    ctx.fillRect(12,8,2,8); ctx.fillRect(26,8,2,8);
    eyes(14,26,22,4);
  } else if(shape === 'bat'){
    const f = Math.sin(t*10)*8;
    ctx.beginPath(); ctx.moveTo(20,20); ctx.lineTo(1,8+f); ctx.lineTo(8,28); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20,20); ctx.lineTo(39,8+f); ctx.lineTo(32,28); ctx.closePath(); ctx.fill();
    circ(20,22,9,color); ctx.fillStyle = color; ctx.fillRect(13,10,4,7); ctx.fillRect(23,10,4,7);
    eyes(17,23,22,3,'#e11d48');
  } else if(shape === 'rock'){
    ctx.fillRect(4,6,32,32); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(4,30,32,8); ctx.fillRect(28,6,8,32);
    eyes(14,26,20,4);
  } else if(shape === 'knight'){
    ctx.fillRect(10,2,20,16); ctx.fillRect(6,20,28,18);
    ctx.fillStyle='#111'; ctx.fillRect(14,8,4,5); ctx.fillRect(22,8,4,5); ctx.fillRect(16,14,8,2);
  } else if(shape === 'ghost'){
    ctx.beginPath(); ctx.arc(20,18,15,Math.PI,0); ctx.lineTo(35,38);
    for(let i=0;i<4;i++){ ctx.lineTo(35-i*10-5,32); ctx.lineTo(35-(i+1)*10,38); }
    ctx.closePath(); ctx.fill(); eyes(14,26,18,4);
  } else if(shape === 'mummy'){
    const bob = Math.round(Math.sin(t*3)*2);
    const S = [[12,2,16,3],[10,5,20,11],[11,16,18,21],[3,15+bob,8,5],[29,15-bob,8,5],[11,37,7,3],[22,37,7,3]];
    ctx.fillStyle = '#2b2118'; S.forEach(s=> ctx.fillRect(s[0]-1,s[1]-1,s[2]+2,s[3]+2));
    ctx.fillStyle = color; S.forEach(s=> ctx.fillRect(s[0],s[1],s[2],s[3]));
    ctx.fillStyle = '#cdbf9f'; ctx.fillRect(25,6,5,10); ctx.fillRect(25,16,4,21); ctx.fillRect(11,34,18,3);
    ctx.fillStyle = '#b3a483'; for(let i=0;i<8;i++){ const y = 6 + i*4; ctx.fillRect(10 + (i&1)*3,y,17 - (i&1)*3,1); }
    ctx.fillStyle = '#f7efd9'; for(let i=0;i<8;i++){ const y = 7 + i*4; ctx.fillRect(12 + (i&1)*2,y,8,1); }
    ctx.fillStyle = '#2b2118'; ctx.fillRect(12,9,16,6);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(15,10,4,4); ctx.fillRect(22,10,4,4);
    ctx.fillStyle = '#fff'; ctx.fillRect(16,10,1,1); ctx.fillRect(23,10,1,1);
    ctx.fillStyle = color; ctx.fillRect(26,38,2,4 + bob); ctx.fillRect(13,38,2,3);
  } else { // boss
    ctx.fillRect(4,14,32,26);
    ctx.beginPath(); ctx.moveTo(4,14); ctx.lineTo(8,0); ctx.lineTo(14,14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26,14); ctx.lineTo(32,0); ctx.lineTo(36,14); ctx.fill();
    eyes(14,26,22,4,'#ff0000');
    ctx.fillStyle='#fff'; for(let i=0;i<4;i++) ctx.fillRect(10+i*6,32,4,5);
  }
}

function drawPlayerAt(x,y,f,walk,glide){
  ctx.save(); ctx.translate(x+13,y); ctx.scale(f,1);
  const R = (c,x,y,w,h)=>{ ctx.fillStyle = c; ctx.fillRect(x,y,w,h); };
  const leg = Math.sin(walk*2)*4;
  /* cabello largo trasero: negro con puntas verdes */
  R('#101018',-14,2,6,14); R('#1b5e3c',-14,14,6,5); R('#2e9e5b',-14,19,6,8); R('#3ddc84',-13,25,3,3);
  /* botas y pantalón */
  R('#14141c',-9+leg,24,8,4); R('#0b0b10',-10+leg,28,9,6); R('#14141c',1-leg,24,8,4); R('#0b0b10',1-leg,28,9,6);
  /* capa negra con ribete crema y forro verde */
  R('#16161f',-12,12,24,14); R('#d8d4c4',-12,25,24,2); R('#d8d4c4',-12,12,2,14); R('#d8d4c4',10,12,2,14);
  R('#1f7a45',-7,11,14,3); R('#e8e4d4',-4,11,8,1);
  /* correa marrón en diagonal, medallón dorado y guante blanco */
  [[-8,13],[-6,16],[-4,19],[-2,22]].forEach(p=> R('#7a4a24',p[0],p[1],3,3));
  R('#d9a441',3,17,6,6); R('#8a5a1a',5,19,2,2);
  R('#f1efe6',8,22,5,4); R('#c9c5b5',8,25,5,1);
  /* empuñadura de la espada al hombro (hasta que consigue la Espada Maestra) */
  if(!player.abilities.sword){ R('#7a4a24',10,-3,3,10); R('#3f2a14',10,0,3,1); R('#3f2a14',10,3,3,1); R('#d9a441',8,7,7,2); }
  /* cabeza de elfo: piel y orejas largas y puntiagudas */
  ctx.fillStyle = '#ecc7a2'; ctx.fillRect(-9,0,18,13);
  ctx.beginPath(); ctx.moveTo(-9,3); ctx.lineTo(-20,-3); ctx.lineTo(-9,9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(9,3); ctx.lineTo(20,-3); ctx.lineTo(9,9); ctx.fill();
  R('#d3a982',-17,-1,3,2); R('#d3a982',15,-1,3,2);
  /* ojos verdes y sonrisa suave */
  R('#0b0b10',-6,5,5,1); R('#0b0b10',2,5,5,1);
  R('#3ddc84',-5,6,3,3); R('#3ddc84',3,6,3,3); R('#0b3d24',-4,7,1,2); R('#0b3d24',4,7,1,2);
  R('#9a5a3a',-2,11,5,1);
  /* cabello negro desordenado con mechones verdes */
  R('#101018',-11,-4,22,7); R('#101018',-9,-8,4,4); R('#101018',-1,-9,5,5); R('#101018',6,-7,4,3); R('#101018',-12,-2,3,8);
  R('#101018',-9,3,6,2); R('#101018',3,3,6,2); R('#101018',-2,3,3,4);
  R('#2e9e5b',-6,-3,2,6); R('#2e9e5b',8,-1,2,5); R('#3a4a52',-6,-6,3,1); R('#3a4a52',2,-7,3,1);
  if(player.abilities.sword){
    ctx.fillStyle='#e5e7eb'; ctx.fillRect(12,2,3,24);
    ctx.fillStyle='#fbbf24'; ctx.fillRect(9,24,9,3);
  }
  if(glide){ ctx.fillStyle='#fff1a8'; ctx.fillRect(-14,-9,28,3); }
  ctx.restore();
}

/* ---------------- DIBUJO: ESCENAS ---------------- */
function drawHUD(){
  panel(10,10,250,78);
  txt('Riuman Nv.' + player.level, 20,30,14,'#fff');
  bar(20,36,150,12,player.hp,player.maxHp,'#22c55e');
  txt(player.hp + '/' + player.maxHp,178,47,12,'#fff');
  txt('XP ' + player.xp + '/' + player.xpNext + '  Pociones:' + (player.potions + player.rp.reduce((a,b)=> a+b, 0)),20,66,12,'#ffd166');

/* ---------------- DESIERTO (mundo abierto) ---------------- */
const DW = 100, DH = 96;
const DESERT_PAL = {sky1:'#ffcf7a',sky2:'#fff0c8',gTop:'#e8c273',gTopL:'#f6dc99',gBody:'#c9974a',gDark:'#a87a35',deco:'#e0b060',accent:'#ffe066'};
const MUMMY = {name:'Momia', hp:24, atk:7, def:2, xp:22, color:'#e8dcc0', shape:'mummy'};
const WEAPONS = [{name:'Espada de Hierro',atk:3},{name:'Cimitarra del Desierto',atk:5},{name:'Hoja del Faraón',atk:8}];
/* Probabilidad de golpe crítico por arma (nunca pasa del 50%) */
const WCRIT = [0.20, 0.28, 0.36], MCRIT = 0.45, FCRIT = 0.10;
function critChance(){
  let c = FCRIT;
  if(player.abilities.sword) c = MCRIT; else if(player.eq >= 0) c = WCRIT[player.bag[player.eq]] || 0.20;
  return Math.min(0.5, c);
}
const CHESTS_DEF = [[9,33,'w',0,1],[24,26,'p',3,2],[38,30,'w',1,2],[14,12,'p',2,2],[30,6,'p',3,2],[52,24,'p',2,2],[46,9,'w',2,0],[70,44,'z',40,2],[78,42,'z',55,2],[88,28,'z',25,2],[20,50,'p',3,2],[60,56,'z',30,2],[88,56,'p',3,2]];
const D = {t:null,chests:[],mums:[],cabin:{x:0,y:0},boss:null,sx:0,sy:0};
const dp = {x:0,y:0,f:1,walk:0,inv:0};
const M = {sel:0};
let dseed = 7;
function sr(){ dseed = (dseed*16807)%2147483647; return dseed/2147483647; }
function dIdx(x,y){ return y*DW+x; }
function clr(x,y,w,h){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(i>0&&j>0&&i<DW-1&&j<DH-1) D.t[dIdx(i,j)] = 0; }
function dSolid(px,py){
  const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=DW||ty>=DH) return true;
  const v = D.t[dIdx(tx,ty)]; return (v>=1 && v<=4) || v === 8 || v === 11 || v === 14;
}
function mkMummy(x,y){ return {type:'enemy',alive:true,def:MUMMY,x:x-18,y:y-18,w:36,h:36,homeX:x,homeY:y,phase:sr()*6,cooldown:0}; }

/* ====== OASIS: reemplazan a los lagos y aparecen en lugares aleatorios (la semilla se guarda en la partida) ====== */
function mkOsr(seed){ let q = Math.floor(Math.abs(+seed || 1)) % 2147483647; if(q <= 0) q = 48271; return ()=>{ q = (q * 16807) % 2147483647; return q / 2147483647; }; }
const OASIS_KIND = {big:{R:9,rx:3.0,ry:2.1,palms:7,rocks:5},med:{R:6,rx:2.3,ry:1.7,palms:4,rocks:3},small:{R:4,rx:1.6,ry:1.2,palms:2,rocks:2}};
function oasisFits(cx,cy,K){
  const R = K.R, rc = K.rx*1.8 + 2.5;
  if(cx-R < 3 || cx+R > DW-4 || cy-R < 3 || cy+R > 61) return false;
  const boxes = [[40,5,52,14],[66,38,82,52]].concat(MPYR.map(p=> [p[0],p[1],p[0]+14,p[1]+12]));
  for(const b of boxes) if(cx+R+1 >= b[0] && cx-R-1 <= b[2] && cy+R+1 >= b[1] && cy-R-1 <= b[3]) return false;
  for(const o of D.oases) if(Math.hypot(o.cx-cx,o.cy-cy) < 17) return false;
  for(const c of D.chests) if(Math.hypot(c.tx-cx,c.ty-cy) < rc) return false;
  for(const p of [{x:D.cabin.x,y:D.cabin.y},{x:D.sx,y:D.sy},{x:30*TILE,y:58*TILE}].concat(D.cabins)) if(Math.hypot(p.x/TILE-cx,p.y/TILE-cy) < R+2.5) return false;
  for(let y=cy-R;y<=cy+R;y++) for(let x=cx-R;x<=cx+R;x++){
    if(Math.hypot(x-cx,y-cy) > R) continue;
    const v = D.t[dIdx(x,y)]; if(v !== 0 && v !== 1 && v !== 2 && v !== 5) return false;
  }
  return true;
}
function placeOases(){
  const t = D.t, rnd = mkOsr(G.dz && G.dz.os);
  D.oases = []; D.palms = []; D.pm = {}; D.tents = []; D.camels = []; D.traders = []; D.mirages = []; D.inO = false;
  /* tamaño, manantial (agua limpia), cerca del inicio */
  const specs = [['big',1,1],['big',1,0],['med',1,0],['med',1,0],['med',0,0],['small',1,0],['small',0,0],['small',0,0]];
  const nearChest = (x,y,r)=> D.chests.some(c=> Math.hypot(c.tx-x,c.ty-y) < r);
  const waterAround = (x,y)=>{ for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const v = t[dIdx(x+i,y+j)]; if(v === 3 || v === 11) return true; } return false; };
  const solidV = v=> v === 3 || v === 11 || v === 8 || v === 14 || (v >= 1 && v <= 4);
  specs.forEach(sp=>{
    const kind = sp[0], K = OASIS_KIND[kind], big = kind === 'big', med = kind === 'med', R = K.R, rx = K.rx, ry = K.ry;
    let cx = 0, cy = 0, ok = false;
    for(let k=0;k<1200 && !ok;k++){
      if(sp[2] && k < 600){ cx = 12 + Math.floor(rnd()*26); cy = 41 + Math.floor(rnd()*(61-R-41+1)); }
      else { cx = 3+R + Math.floor(rnd()*(DW-4-R-(3+R)+1)); cy = 3+R + Math.floor(rnd()*(61-R-(3+R)+1)); }
      ok = oasisFits(cx,cy,K);
    }
    if(!ok) return;
    const o = {cx:cx,cy:cy,R:R,rx:rx,ry:ry,big:big,kind:kind,spring:!!sp[1]}; D.oases.push(o);
    const oi = D.oases.length-1, wid = o.spring ? 3 : 11;
    /* forma irregular: elipse girada, orilla ondulada y a veces un segundo lóbulo de agua */
    const rot = rnd()*3.14159, w1 = rnd()*6.2832, w2 = rnd()*6.2832, a1 = 0.10 + rnd()*0.10, a2 = 0.06 + rnd()*0.08;
    const lobe = rnd() < 0.65 ? {x:(rnd()<0.5 ? -1 : 1)*rx*(0.45+rnd()*0.25), y:(rnd()<0.5 ? -1 : 1)*ry*(0.4+rnd()*0.3), s:0.5 + rnd()*0.15} : null;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const dn = (x,y)=>{
      const dx = x-cx, dy = y-cy, u = dx*cr + dy*sr, v = -dx*sr + dy*cr, th = Math.atan2(dy,dx);
      let d = Math.hypot(u/rx,v/ry) / (1 + a1*Math.sin(3*th+w1) + a2*Math.sin(5*th+w2));
      if(lobe) d = Math.min(d, Math.hypot((dx-lobe.x)/(rx*lobe.s),(dy-lobe.y)/(ry*lobe.s)));
      return d;
    };
    for(let y=cy-R;y<=cy+R;y++) for(let x=cx-R;x<=cx+R;x++){
      const dist = Math.hypot(x-cx,y-cy); if(dist > R) continue;
      const d = dn(x,y) + (rnd()-0.5)*0.22, i = dIdx(x,y);
      if(d <= 1) t[i] = wid;
      else if(d <= 1.5) t[i] = rnd() < 0.3 ? 10 : 13;
      else if(rnd() < Math.max(0.06, Math.min(0.96, 1 - (dist - rx*1.7) / (R - rx*1.7 + 0.001)))) t[i] = 9;
      else t[i] = 0;
    }
    o.dn = null;
    if(big){   /* campamento nómada: tienda para dormir, mercader, fogata y camello */
      const cand = [];
      for(let y=cy-R+1;y<=cy+R-2;y++) for(let x=cx-R+1;x<=cx+R-4;x++) cand.push([x,y]);
      for(let i=cand.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const q = cand[i]; cand[i] = cand[j]; cand[j] = q; }
      for(const c of cand){
        const x = c[0], y = c[1];
        if(nearChest(x+1,y,4)) continue;
        let free = true;
        for(let j=-1;j<=2 && free;j++) for(let i=-1;i<=4;i++){ const xx = x+i, yy = y+j, v = t[dIdx(xx,yy)]; if(Math.hypot(xx-cx,yy-cy) > R-0.3 || (v !== 9 && v !== 0 && v !== 1 && v !== 2 && v !== 5) || (j >= 0 && i >= 0 && i <= 3 && waterAround(xx,yy))){ free = false; break; } }
        if(!free) continue;
        for(let j=0;j<=1;j++) for(let i=0;i<=3;i++) t[dIdx(x+i,y+j)] = 9;
        D.tents.push({x:x*TILE+20,y:y*TILE+34}); D.traders.push({x:(x+2)*TILE+20,y:y*TILE+34}); D.camels.push({x:(x+3)*TILE+20,y:(y+1)*TILE+32,f:rnd() < 0.5 ? 1 : -1});
        break;
      }
    }
    /* palmeras agrupadas, de distintos tamaños e inclinaciones */
    const nClu = big ? 3 : (med ? 2 : 1), cl = [];
    for(let k=0;k<nClu;k++){ const ang = rnd()*6.2832, rr = 1.8 + rnd()*0.9; cl.push([cx+Math.cos(ang)*rx*rr, cy+Math.sin(ang)*ry*rr]); }
    let placed = 0;
    for(let k=0;k<500 && placed<K.palms;k++){
      const c = cl[k % nClu], x = Math.round(c[0] + (rnd()-0.5)*5), y = Math.round(c[1] + (rnd()-0.5)*4);
      if(x < 2 || y < 2 || x >= DW-2 || y >= DH-2 || Math.hypot(x-cx,y-cy) > R || t[dIdx(x,y)] !== 9 || nearChest(x,y,3.6)) continue;
      if(D.palms.some(p=> Math.hypot(p.tx-x,p.ty-y) < 2.2) || D.tents.some(q=> Math.hypot(q.x/TILE+1.5-x,q.y/TILE-y) < 3.2)) continue;
      const sz = 0.7 + rnd()*0.55, p = {tx:x,ty:y,id:D.palms.length,o:oi,sz:sz,lean:(rnd()-0.5)*1.6,dates:sz >= 0.85};
      t[dIdx(x,y)] = 8; D.palms.push(p); D.pm[dIdx(x,y)] = p; placed++;
    }
    if(big || med){   /* un camello descansando a la sombra de una palmera */
      const mine = D.palms.filter(q=> q.o === oi);
      for(let k=0;k<40 && mine.length;k++){
        const p = mine[Math.floor(rnd()*mine.length)];
        if(t[dIdx(p.tx+1,p.ty+1)] === 9 && !nearChest(p.tx+1,p.ty+1,2.5) && !D.camels.some(c=> Math.hypot(c.x-((p.tx+1)*TILE+20),c.y-((p.ty+1)*TILE+32)) < 90)){ D.camels.push({x:(p.tx+1)*TILE+20,y:(p.ty+1)*TILE+32,f:rnd() < 0.5 ? 1 : -1}); break; }
      }
    }
    /* rocas naturales (sólidas, sin tapar la orilla) */
    let rk = 0;
    for(let k=0;k<400 && rk<K.rocks;k++){
      const ang = rnd()*6.2832, rr = 1.3 + rnd()*2.4, x = Math.round(cx + Math.cos(ang)*rx*rr), y = Math.round(cy + Math.sin(ang)*ry*rr);
      if(x < 2 || y < 2 || x >= DW-2 || y >= DH-2 || Math.hypot(x-cx,y-cy) > R-0.5) continue;
      const v = t[dIdx(x,y)]; if(v !== 9 && v !== 13 && v !== 0) continue;
      if(waterAround(x,y) || nearChest(x,y,3.6)) continue;
      if(D.palms.some(p=> Math.hypot(p.tx-x,p.ty-y) < 2) || D.tents.some(q=> Math.hypot(q.x/TILE-x,q.y/TILE-y) < 3.2)) continue;
      let clash = false; for(let j=-2;j<=2 && !clash;j++) for(let i=-2;i<=2;i++) if(t[dIdx(x+i,y+j)] === 14) clash = true;
      if(clash) continue;
      t[dIdx(x,y)] = 14; rk++;
    }
    /* arbustos, vegetación densa y plantas del desierto */
    for(let y=cy-R;y<=cy+R;y++) for(let x=cx-R;x<=cx+R;x++){
      const dist = Math.hypot(x-cx,y-cy); if(dist > R) continue;
      const i = dIdx(x,y), v = t[i], r = rnd();
      if(v === 9 && dist > rx*1.6 && r < 0.07 && !nearChest(x,y,2)) t[i] = 12;

    }
    for(let k=0, n=big ? 3 : (med ? 2 : 1); k<n; k++){
      const ang = rnd()*6.2832, rr = 1.9 + rnd()*0.8, px = Math.round(cx + Math.cos(ang)*rx*rr), py = Math.round(cy + Math.sin(ang)*ry*rr);
      for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++){ const x = px+i, y = py+j; if(Math.hypot(i,j) <= 2.1 && t[dIdx(x,y)] === 9 && rnd() < 0.85 && !nearChest(x,y,2)) t[dIdx(x,y)] = 15; }
    }
    /* el oasis es un refugio: las momias errantes (no los guardianes de cofres) se mueven fuera de él; mismo índice, así no se rompen las partidas */

      const hx = Math.floor(m.homeX/TILE), hy = Math.floor(m.homeY/TILE);
      if(Math.hypot(hx-cx,hy-cy) > R+1.5 || m.ruin || m === D.boss || nearChest(hx,hy,3.6)) continue;
      const ang = Math.atan2(hy-cy,hx-cx || 0.001), bad = (x,y)=>{ for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if(solidV(t[dIdx(x+i,y+j)])) return true; return false; };
      let done = false;
      for(let r=R+2.5;r<=R+18 && !done;r+=1) for(const da of [0,0.35,-0.35,0.7,-0.7,1.1,-1.1,1.6,-1.6,2.2,-2.2,3.14]){
        const x = Math.round(cx + Math.cos(ang+da)*r), y = Math.round(cy + Math.sin(ang+da)*r);
        if(x < 2 || y < 2 || x >= DW-2 || y >= 62 || bad(x,y) || D.oases.some(q=> Math.hypot(q.cx-x,q.cy-y) < q.R+1)) continue;
        m.homeX = x*TILE+20; m.homeY = y*TILE+20; m.x = m.homeX-18; m.y = m.homeY-18; done = true; break;
      }
    }
  });
  for(let k=0;k<500 && D.mirages.length < 4;k++){   /* espejismos: parecen oasis pero se desvanecen al acercarte */
    const x = 8 + Math.floor(rnd()*(DW-16)), y = 8 + Math.floor(rnd()*48);
    if(t[dIdx(x,y)] !== 0) continue;
    if(D.oases.some(o=> Math.hypot(o.cx-x,o.cy-y) < 14)) continue;
    if(D.mirages.some(m=> Math.hypot(m.x/TILE-x,m.y/TILE-y) < 18)) continue;
    D.mirages.push({x:x*TILE+20,y:y*TILE+20,s:0.8+rnd()*0.5});
  }
}
function oasisAt(px,py){ if(!D.oases) return null; for(const o of D.oases) if(Math.hypot(px-(o.cx*TILE+20),py-(o.cy*TILE+20)) < (o.R-1)*TILE) return o; return null; }
function nearestOasis(){
  let b = null, bd = 1e9;
  for(const pass of [true,false]){
    for(const o of (D.oases || [])){ if(pass && !o.spring) continue; const d = Math.hypot(o.cx*TILE+20-dp.x,o.cy*TILE+20-dp.y); if(d < bd){ bd = d; b = o; } }
    if(b) break;
  }
  return b ? {x:b.cx*TILE+20,y:b.cy*TILE+20} : null;
}

function loadDesert(){

  const t = D.t = new Uint8Array(DW*DH);
  for(let i=0;i<DW*DH;i++) t[i] = sr()<0.05 ? 5 : 0;
  for(let i=0;i<700;i++){ const x=1+Math.floor(sr()*(DW-2)), y=1+Math.floor(sr()*(DH-2)); t[dIdx(x,y)] = sr()<0.6 ? 2 : 1; }
  for(let x=0;x<DW;x++){ t[dIdx(x,0)] = 1; t[dIdx(x,DH-1)] = 1; }
  for(let y=0;y<DH;y++){ t[dIdx(0,y)] = 1; t[dIdx(DW-1,y)] = 1; }
  for(let x=40;x<=52;x++){ t[dIdx(x,5)] = 4; t[dIdx(x,14)] = 4; }
  for(let y=5;y<=14;y++){ t[dIdx(40,y)] = 4; t[dIdx(52,y)] = 4; }
  clr(41,6,11,8); clr(45,14,3,1);
  const pyr = (x0,y0,x1,y1,dx)=>{ for(let x=x0;x<=x1;x++){ t[dIdx(x,y0)] = 4; t[dIdx(x,y1)] = 4; } for(let y=y0;y<=y1;y++){ t[dIdx(x0,y)] = 4; t[dIdx(x1,y)] = 4; } clr(x0+1,y0+1,x1-x0-1,y1-y0-1); clr(dx,y1,3,1); };
  QSP.forEach(q=>{ for(let y=q[1]-q[2];y<=q[1]+q[2];y++) for(let x=q[0]-q[2];x<=q[0]+q[2];x++) if((x-q[0])*(x-q[0])+(y-q[1])*(y-q[1]) <= q[2]*q[2] && t[dIdx(x,y)] === 0) t[dIdx(x,y)] = 6; });
  pyr(66,38,82,52,73);
  const mpyr = (x0,y0)=>{
    for(let x=x0;x<=x0+14;x++){ t[dIdx(x,y0)] = 4; t[dIdx(x,y0+12)] = 4; }
    for(let y=y0;y<=y0+12;y++){ t[dIdx(x0,y)] = 4; t[dIdx(x0+14,y)] = 4; }
    clr(x0+1,y0+1,13,11); clr(x0+6,y0+12,3,1);
    for(let x=x0+1;x<=x0+13;x++){ if(x > x0+2) t[dIdx(x,y0+8)] = 4; if(x < x0+12) t[dIdx(x,y0+4)] = 4; }
  };
  MPYR.forEach(p=> mpyr(p[0],p[1]));
  D.sx = 3*TILE+20; D.sy = 36*TILE+34; clr(1,33,6,6); clr(13,33,9,5); D.cabin = {x:17*TILE+20, y:35*TILE+30}; clr(12,28,11,5); D.cabins = [14,17,20].map(x=> ({x:x*TILE+20, y:31*TILE+30}));
  D.chests = []; D.mums = [];
  const offs = [[-2,0],[2,0],[0,2],[0,-2]];
  for(const c of CHESTS_DEF){
    clr(c[0]-3,c[1]-3,7,7);
    const rr = c[2] === 'p' ? (c[3] >= 3 ? 1 : 0) : c[2] === 'z' ? (c[3] >= 50 ? 2 : 1) : -1;
    D.chests.push({tx:c[0],ty:c[1],kind:rr >= 0 ? 'r' : c[2],r:Math.min(rr,REGION_MAX_RAR),val:c[3],open:false});
    for(let g=0; g<c[4]; g++) D.mums.push(mkMummy((c[0]+offs[g][0])*TILE+20,(c[1]+offs[g][1])*TILE+20));
  }
  D.boss = mkBoss(46*TILE+20, 8*TILE+20); D.mums.push(D.boss);
  MPYR.forEach(p=>{
    const x0 = p[0], y0 = p[1];
    [[4,10],[10,10],[4,6],[9,6],[4,2],[10,2]].forEach(o=> D.mums.push(mkElite((x0+o[0])*TILE+20,(y0+o[1])*TILE+20)));
    D.chests.push({tx:x0+7,ty:y0+2,kind:'r',r:Math.min(p[2],REGION_MAX_RAR),val:0,open:false});
  });
  for(let n=0;n<26;n++){

    }
  }

function updateDesertCam(){ G.camX = clamp(dp.x-W/2,0,DW*TILE-W); G.camY = clamp(dp.y-H/2,0,DH*TILE-H); }

function dMove(dx,dy){
  const hw = 9;
  const ok = (x,y)=> !(dSolid(x-hw,y)||dSolid(x+hw,y)||dSolid(x-hw,y-12)||dSolid(x+hw,y-12));
  if(dx && ok(dp.x+dx,dp.y)) dp.x += dx;
  if(dy && ok(dp.x,dp.y+dy)) dp.y += dy;
}

function updateDesert(dt){
  let mx = 0, my = 0;
  if(keys['ArrowLeft']||keys['KeyA']) mx--;
  if(keys['ArrowRight']||keys['KeyD']) mx++;
  if(keys['ArrowUp']||keys['KeyW']) my--;
  if(keys['ArrowDown']||keys['KeyS']) my++;
  const inQS = D.t[dIdx(Math.floor(dp.x/TILE), Math.floor((dp.y-6)/TILE))] === 6;
  dp.sink = clamp((dp.sink || 0) + (inQS ? dt/3 : -dt/1.2), 0, 1);
  if(dp.sink >= 1){ G.dz.qt = (G.dz.qt || 0) + dt; if(G.dz.qt >= 1.5){ G.dz.qt = 0; if(player.hp > 1){ player.hp = Math.max(1, player.hp - 3); toast('¡Arenas movedizas! Sal de ahí'); } } }
  const sp = 3.2 * (1 - 0.65*dp.sink);
  if(mx||my){ const l = Math.hypot(mx,my); dMove(mx/l*sp,0); dMove(0,my/l*sp); dp.walk += 0.25; if(mx) dp.f = mx; }
  if(dp.inv > 0) dp.inv--;
  ruinsTick(); mpTick(dt); const z = G.dz; z.cl += dt; dayTick(); z.dt += dt;
  const oz = oasisAt(dp.x,dp.y);   /* dentro de un oasis: sombra (menos sed), descanso y las momias no te persiguen */
  z.hyd = Math.max(0, z.hyd - dt*0.6*(oz ? 0.25 : 1));
  if(oz){
    if(!D.inO && G.t - (D.ot || -99) > 20){ toast('Llegas a un oasis: sombra, agua y descanso'); D.ot = G.t; }
    z.oh = (z.oh || 0) + dt; if(z.oh >= 3){ z.oh = 0; if(player.hp < player.maxHp) player.hp++; }
  }
  D.inO = !!oz;
  if(z.hyd <= 0){ z.tt += dt; if(z.tt >= 2){ z.tt = 0; if(player.hp > 1){ player.hp = Math.max(1, player.hp - 2); toast('¡Deshidratado! Pierdes PV'); } } }
  for(const m of D.mums){
    if(!m.alive || !awakeM(m)) continue;
    m.phase += dt*2; if(m.cooldown > 0) m.cooldown--;
    const cx = m.x+18, cy = m.y+18, pd = Math.hypot(dp.x-cx,(dp.y-10)-cy);
    let tx = m.homeX+Math.cos(m.phase)*20, ty = m.homeY+Math.sin(m.phase*1.3)*20, sp = 0.6;
    if(pd < 150 && Math.hypot(dp.x-m.homeX,dp.y-m.homeY) < 260 && dp.inv <= 0 && !oz){ tx = dp.x; ty = dp.y-10; sp = 1.3; }
    const vx = tx-cx, vy = ty-cy, vl = Math.hypot(vx,vy) || 1;
    if(vl > 2){
      const nx = cx+vx/vl*sp, ny = cy+vy/vl*sp;
      if(!dSolid(nx,cy)) m.x = nx-18;
      if(!dSolid(m.x+18,ny)) m.y = ny-18;
    }
    if(m.cooldown <= 0 && dp.inv <= 0 && pd < 26){ startBattle(m); return; }
  }
  updateDesertCam();
}

function menuKey(c){

  M.sel = clamp(M.sel,0,n-1);
  if(c==='ArrowUp' || c==='KeyW') M.sel = (M.sel+n-1)%n;
  if(c==='ArrowDown' || c==='KeyS') M.sel = (M.sel+1)%n;
  if(c==='KeyZ' || c==='Enter'){
    const it = L[M.sel];
    if(it.k === 'pot'){ if(potCount(it.i) > 0 && player.hp < player.maxHp){ usePot(it.i); applyFx(it.i); player.hp = Math.min(player.maxHp, player.hp + POTS[it.i].heal); beep(700,0.12,'sine',0.05); } }

    else if(it.k === 'wpn') equip(it.i);

}

async function copyTextToClipboard(value){
  const text = String(value == null ? '' : value);
  if(!text) throw new Error('empty');
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  const field = document.createElement('textarea');
  field.value = text; field.setAttribute('readonly','');
  field.style.position = 'fixed'; field.style.left = '-9999px'; field.style.top = '0';
  document.body.appendChild(field); field.focus(); field.select(); field.setSelectionRange(0, text.length);
  let copied = false;
  try{ copied = document.execCommand('copy'); }catch(e){}
  field.remove();
  if(!copied) throw new Error('copy_failed');
  return true;
}

  if(e.target.dataset.a === 'vol'){ S.vol = e.target.value / 100; document.getElementById('vo').textContent = e.target.value + '%'; saveS(); }

UI.el.addEventListener('change', function(e){
  const x = e.target;
  if(x.id === 'lgf'){ const f0 = x.files[0]; x.value = ''; importFile(f0); return; }
  if(x.id === 'qf'){ scanImage(x.files[0]); return; }
  if(x.dataset.a === 'vol') beep(660,0.08,'square',0.05);

window.addEventListener('keydown', function(e){
  if(!UI.open) return;
  if(e.key === 'Escape'){ if(UI.cur !== 'main' && UI.cur !== 'login') UI.back(); e.preventDefault(); }
  else if(e.key === 'Enter' && (UI.cur === 'login' || UI.cur === 'qrpw') && e.target.tagName === 'INPUT'){ e.preventDefault(); if(UI.cur === 'qrpw') applyImport(UI.arg, document.getElementById('lgp').value); else if(Object.keys(accounts()).length) doLogin(); else doRegister(); }
  else if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.closest && e.target.closest('.rail > .cd')){
    const rl = e.target.closest('.rail'), cs = Array.from(rl.children), dir = e.key === 'ArrowRight' ? 1 : -1;
    let i = cs.indexOf(rl.querySelector('.cd.sel') || e.target.closest('.rail > .cd')) + dir;
    for(; i >= 0 && i < cs.length; i += dir){
      const n = cs[i], f = (n.tagName === 'BUTTON' && !n.disabled) ? n : n.querySelector('button:not(:disabled)');
      if(f){ selCard(n); f.focus(); break; }
    }
    e.preventDefault();
  }
  else if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.tagName === 'BUTTON'){
    const l = Array.from(UI.el.querySelectorAll('button:not(:disabled),input,select')), i = l.indexOf(e.target);
    l[(i + (e.key === 'ArrowDown' ? 1 : l.length-1)) % l.length].focus(); e.preventDefault();
  }
});

/* ====== CICLO DE DÍA Y NOCHE Y SISTEMA DE SUEÑO ====== */
const DAY_LEN = 180;
function nightA(){
  const p = (G.dz.cl % DAY_LEN) / DAY_LEN;
  if(p < 0.55) return 0; if(p < 0.65) return (p-0.55)/0.1; if(p < 0.9) return 1; return 1-(p-0.9)/0.1;
}
function awakeM(m){ return m.ruin || !(m.nz && nightA() > 0.5); }
function nightOverlay(){ const a = inRuins() ? 0.45 : nightA(); if(a > 0){ ctx.fillStyle = 'rgba(8,10,48,' + (0.55*a) + ')'; ctx.fillRect(0,0,W,H); } }
function nearCab(){ for(const c of D.cabins) if(Math.hypot(dp.x-c.x,dp.y-c.y) < 46) return true; for(const c of (D.tents || [])) if(Math.hypot(dp.x-c.x,dp.y-c.y) < 50) return true; return false; }
/* Cofres que se renuevan cada día: se cierran de nuevo y sacan objetos distintos.
   z.cd guarda el último día en que se renovaron (así el multijugador y las partidas guardadas no se desfasan). */
function refreshChests(){
  for(const c of D.chests){ c.open = false; c.loot = null; }
  G.dz.pk = [];   /* las palmeras vuelven a tener dátiles */
  try{ if(typeof MP !== 'undefined' && MP.lc) MP.lc = D.chests.map(c=> !!c.open); }catch(e){}
  if(G.scene === 'desert') toast('¡Nuevo día! Cofres y palmeras se renovaron');
}
function chestDaySync(){
  const z = G.dz;
  if(z.cd === undefined){ z.cd = z.day; return; }   /* partida antigua o recién unida: se adopta el día actual sin renovar */
  if(z.cd !== z.day){ z.cd = z.day; refreshChests(); }
}
function dayTick(){
  const z = G.dz, nd = Math.floor(z.cl/DAY_LEN) + 1;
  chestDaySync();
  if(nd <= z.day) return;
  z.day = nd; chestDaySync();
  if(z.slept) z.ins = 0;
  else {
    z.ins++;
    if(z.ins >= 7){ player.lives = 0; G.scene = 'gameover'; beep(110,0.4,'sawtooth',0.06); return; }
    toast('Noche sin dormir: te sientes más débil (' + z.ins + '/7)');
  }
  z.slept = false;
}
function trySleep(){
  const z = G.dz;
  if(nightA() < 0.5){ toast('Solo puedes dormir al caer la noche'); return; }
  if(z.zk < 8){ toast('Necesitas 8 Zakuy para dormir'); return; }
  z.zk -= 8; G.slp = {t:0, done:false}; G.scene = 'sleep';
}
function updateSleep(dt){
  const s2 = G.slp; s2.t += dt;
  if(!s2.done && s2.t > 1){
    s2.done = true; const z = G.dz;
    z.slept = true; z.cl = z.day*DAY_LEN + 1; player.hp = player.maxHp; z.hyd = Math.max(15, z.hyd-15);
    dayTick(); toast('Dormiste bien. ¡Amanece un nuevo día y los cofres se renovaron!');
  }
  if(s2.t > 2.2 && G.scene === 'sleep') G.scene = 'desert';
}
function drawSleep(){
  const s2 = G.slp, a = Math.min(1, s2.t < 1 ? s2.t : (s2.t < 1.6 ? 1 : (2.2-s2.t)/0.6));

const RAR = [
  {n:'Común',c:'#9ca3af',cnt:[1,2]},{n:'Poco común',c:'#4ade80',cnt:[2,3]},{n:'Épica',c:'#a855f7',cnt:[3,5]},
  {n:'Legendaria',c:'#fbbf24',cnt:[4,6]},{n:'Real',c:'#3b82f6',cnt:[5,7]},{n:'Divina',c:'#fff1a8',cnt:[6,8]},{n:'Deidad',c:'#f43f5e',cnt:[7,9]}
];
const REGION_MAX_RAR = 2;   /* el primer reino (desierto) solo llega hasta Épica */
function rollLoot(r){
  const n = rnd(RAR[r].cnt[0], RAR[r].cnt[1]), L = [];
  for(let i=0;i<n;i++){
    const x = Math.random();
    if(x < 0.35) L.push({k:'zk',v:(8 + rnd(0,6)) * (r+1)});
    else if(x < 0.65) L.push({k:'pot',v:Math.min(2+r, rollPot() + (r >= 2 ? 1 : 0))});
    else if(x < 0.80) L.push({k:'bot',v:1});
    else if(x < 0.90) L.push({k:'clean',v:1});
    else L.push({k:'xp',v:(10 + rnd(0,8)) * (r+1)});
  }
  return L;
}
function lootInfo(it){
  if(it.k === 'zk') return {n:'Zakuy x' + it.v, d:'Moneda del desierto. Se gasta en la tienda.', c:'#ffd166'};
  if(it.k === 'pot') return {n:'Poción ' + POTS[it.v].n, d:POTS[it.v].d, c:POTS[it.v].c};
  if(it.k === 'bot') return {n:'Botella vacía', d:WITEMS.bot.d, c:WITEMS.bot.c};
  if(it.k === 'clean') return {n:'Agua limpia', d:WITEMS.clean.d, c:WITEMS.clean.c};
  return {n:'Experiencia +' + it.v + ' XP', d:'Fragmentos de experiencia antigua.', c:'#7dd3fc'};
}
function takeItem(it){
  if(it.k === 'zk') G.dz.zk += it.v; else if(it.k === 'pot') givePot(it.v); else if(it.k === 'bot') G.dz.bot++;
  else if(it.k === 'clean') G.dz.clean++; else if(gainXp(it.v)) toast('¡Subes al nivel ' + player.level + '!');
}
function openLoot(c){
  if(!c.loot) c.loot = rollLoot(c.r);
  G.loot = {c:c, sel:0}; G.scene = 'loot'; beep(660,0.1,'square',0.06); setTimeout(()=>beep(990,0.15,'square',0.06),100);
}
function lootKey(k){
  const g = G.loot, L = g.c.loot, n = L.length + 1;
  if(k==='KeyC' || k==='KeyX' || k==='Escape'){ G.scene = 'desert'; return; }
  if(k==='ArrowUp' || k==='KeyW') g.sel = (g.sel+n-1)%n;
  if(k==='ArrowDown' || k==='KeyS') g.sel = (g.sel+1)%n;
  if(k==='KeyZ' || k==='Enter'){
    if(g.sel === L.length){ while(L.length) takeItem(L.shift()); } else takeItem(L.splice(g.sel,1)[0]);
    beep(880,0.08,'square',0.05); g.sel = Math.min(g.sel, L.length);
    if(!L.length){ g.c.open = true; G.scene = 'desert'; toast('¡Cofre vacío!'); }
  }
}

function ensureAudio(){ try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){} }

function wantTrack(){
  const sc = G.scene;
  if(sc === 'title') return 'menu';
  if(sc === 'battle') return battle.ent === D.boss ? 'miniboss' : 'battle';
  if(sc === 'desert') return (nightA() > 0.5 || inRuins()) ? 'night' : 'desert';
  if(sc === 'shop' || sc === 'sleep') return 'shop';
  if(sc === 'gameover') return 'over';
  return MU.cur;
}
function mNote(w,f,t,d,v){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = w; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(MU.tg); o.start(t); o.stop(t+d+0.02);
}
function mNoise(t,d,v){
  const s2 = actx.createBufferSource(), g = actx.createGain();
  s2.buffer = MU.nb; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s2.connect(g); g.connect(MU.tg); s2.start(t); s2.stop(t+d+0.02);
}
function mStep(tr,i,t,sd){
  const f = n=> 440*Math.pow(2,(tr.root+n-69)/12), ld = tr.lead[i % tr.lead.length];
  if(ld !== null) mNote(tr.lw,f(ld),t,sd*0.9,0.5);
  if(i % tr.bl === 0) mNote(tr.bw,f(tr.bass[(i/tr.bl) % tr.bass.length]),t,sd*tr.bl*0.95,0.7);
  const d = tr.dr ? tr.dr[i % tr.dr.length] : '.';
  if(d === 'k'){
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g); g.connect(MU.tg); o.start(t); o.stop(t+0.16);
  } else if(d === 's') mNoise(t,0.12,0.5); else if(d === 'h') mNoise(t,0.04,0.2);
}
function musicTick(){
  if(!actx || actx.state !== 'running') return;
  if(!MU.mg){
    MU.mg = actx.createGain(); MU.mg.connect(actx.destination);
    const n = (actx.sampleRate*0.3)|0, b = actx.createBuffer(1,n,actx.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    MU.nb = b;
  }
  MU.mg.gain.setTargetAtTime((S.mute || !S.music) ? 0 : S.vol*0.3, actx.currentTime, 0.1);
  const w = wantTrack();
  if(w !== MU.cur){
    const now = actx.currentTime;
    if(MU.tg) MU.tg.gain.setTargetAtTime(0,now,0.15);
    MU.tg = actx.createGain(); MU.tg.gain.value = 0; MU.tg.gain.setTargetAtTime(1,now+0.05,0.2); MU.tg.connect(MU.mg);
    MU.cur = w; MU.step = 0; MU.next = now + 0.1;
  }
  const tr = MUS[MU.cur]; if(!tr) return;
  const sd = 30/tr.bpm;
  while(MU.next < actx.currentTime + 0.25){ mStep(tr,MU.step,MU.next,sd); MU.next += sd; MU.step++; }
}

function padKey(code,down){
  if(!!PAD.held[code] === down) return;
  PAD.held[code] = down;
  window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',{code:code,key:code,bubbles:true}));
}

function padUI(dir,btn){
  const p = PAD.prev, E = (c,o)=> c && !o;
  const els = Array.from(UI.el.querySelectorAll('button:not(:disabled),input,select')), cur = document.activeElement, i = els.indexOf(cur), n = els.length;
  if((E(dir.d,p.dir.d) || E(dir.u,p.dir.u)) && n) els[i < 0 ? (dir.d ? 0 : n-1) : (i + (dir.d ? 1 : -1) + n) % n].focus();
  if(E(btn.a,p.btn.a) && cur && cur.tagName === 'BUTTON') cur.click();
  if(E(btn.b,p.btn.b) && UI.cur !== 'main' && UI.cur !== 'login') UI.back();
  if((E(dir.l,p.dir.l) || E(dir.r,p.dir.r)) && cur){
    if(cur.type === 'range'){ cur.value = clamp(+cur.value + (dir.r ? 5 : -5),0,100); cur.dispatchEvent(new Event('input',{bubbles:true})); cur.dispatchEvent(new Event('change',{bubbles:true})); }

  }
}
function padTick(){
  if(PAD.dead) return;
  let gps = [];
  try{ gps = navigator.getGamepads ? navigator.getGamepads() : []; }catch(e){ PAD.dead = true; return; }
  let gp = null; for(const g of gps){ if(g && g.connected){ gp = g; break; } }
  if(!gp){
    if(PAD.on){ PAD.on = false; padNote(t('padOff')); Object.keys(PAD.held).forEach(k=> padKey(k,false)); }
    return;
  }
  if(!PAD.on){ PAD.on = true; padNote(t('padOn')); }
  const b = i=> !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes || [];
  const dir = {u:b(12) || ax[1] < -0.5, d:b(13) || ax[1] > 0.5, l:b(14) || ax[0] < -0.5, r:b(15) || ax[0] > 0.5};
  const btn = {a:b(0), b:b(1), x:b(2) || b(3) || b(9)};
  if(UI.open){ padUI(dir,btn); Object.keys(PAD.held).forEach(k=> padKey(k,false)); }
  else { const want = {ArrowUp:dir.u,ArrowDown:dir.d,ArrowLeft:dir.l,ArrowRight:dir.r,KeyZ:btn.a,KeyC:btn.b,KeyX:btn.x}; for(const k in want) padKey(k,want[k]); }
  PAD.prev = {dir:dir, btn:btn};
}

const RELITE = {name:'Guardián de las ruinas', hp:62, atk:10, def:4, xp:80, color:'#b9a8d9', shape:'mummy'};
function inRuins(){ return dp.y > 65*TILE; }
function buildRuins(){
  const t = D.t, S = (x,y,v)=>{ t[dIdx(x,y)] = v; };
  for(let y=64;y<DH-1;y++) for(let x=1;x<DW-1;x++) S(x,y,4);
  const room = (x0,y0,x1,y1)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) S(x,y,7); };
  room(4,74,14,84); room(15,78,20,80); room(38,78,40,80); room(58,78,60,80); room(78,77,96,81); room(86,76,93,82);
  const PO = [[5,6],[11,6],[5,12],[11,12]], MO = [[3,3],[13,3],[3,15],[13,15],[8,5],[8,13]], CNT = [4,5,6];
  [21,41,61].forEach((x0,ci)=>{
    room(x0,70,x0+16,88);
    PO.forEach(o=>{ S(x0+o[0],70+o[1],4); S(x0+o[0]+1,70+o[1],4); S(x0+o[0],71+o[1],4); S(x0+o[0]+1,71+o[1],4); });
    const ms = [];
    for(let i=0;i<CNT[ci];i++){ const m = mkMummy((x0+MO[i][0])*TILE+20,(70+MO[i][1])*TILE+20); m.def = RELITE; m.ruin = true; ms.push(m); D.mums.push(m); }
    D.chests.push({tx:x0+8,ty:79,kind:'r',r:3,val:0,open:false,lock:ms});
  });
  clr(28,56,5,5);
  D.ruinIn = {x:30*TILE+20,y:58*TILE+20}; D.ruinOut = {x:5*TILE+20,y:79*TILE+20}; D.qsOn = false;
}
function nearNpc(){ const n = G.dz.npc; return !!n && !inRuins() && Math.hypot(dp.x-n.x,dp.y-n.y) < 50; }
function nearRuinIn(){ return G.dz.q >= 3 && !inRuins() && Math.hypot(dp.x-D.ruinIn.x,dp.y-D.ruinIn.y) < 50; }
function nearRuinOut(){ return inRuins() && Math.hypot(dp.x-D.ruinOut.x,dp.y-D.ruinOut.y) < 50; }
function enterRuins(){ dp.x = 9*TILE+20; dp.y = 79*TILE+20; dp.sink = 0; updateDesertCam(); beep(200,0.3,'sawtooth',0.05); toast('Entras a las ruinas del desierto...'); }
function leaveRuins(){ dp.x = D.ruinIn.x; dp.y = D.ruinIn.y + 50; updateDesertCam(); toast('Sales de las ruinas'); }
function spawnNpc(){
  for(let k=0;k<300;k++){
    const x = 3 + Math.floor(Math.random()*(DW-6)), y = 3 + Math.floor(Math.random()*58);
    let ok = true;
    for(let j=-1;j<=1&&ok;j++) for(let i=-1;i<=1;i++) if(D.t[dIdx(x+i,y+j)] !== 0) ok = false;
    if(ok && Math.hypot(x*TILE-D.sx,y*TILE-D.sy) > 400){ G.dz.npc = {x:x*TILE+20,y:y*TILE+20}; G.dz.q = 1; toast('¡Alguien apareció en el desierto! Sigue la flecha'); return; }
  }
}
function arrowTarget(){
  const z = G.dz;
  if((z.q === 1 || (z.q === 2 && z.vend >= 6 && z.crist >= 2)) && z.npc) return z.npc;
  if(z.q === 3) return D.ruinIn;
  return null;
}
function talkNpc(){
  const z = G.dz;
  if(z.q === 1){ z.q = 2; showDialog(['Viajero... derrotaste al Guardián del Faraón.','Soy explorador y necesito materiales para un mapa.','Tráeme 6 Vendas antiguas y 2 Cristales de arena.','Las momias los llevan encima. Te daré el mapa.']); }
  else if(z.q === 2){
    if(z.vend >= 6 && z.crist >= 2){ z.q = 3; z.vend -= 6; z.crist -= 2; showDialog(['¡Los trajiste! Excelente.','Toma el mapa: marca la entrada de unas ruinas.','Cada cámara tiene guardianes y un tesoro legendario.']); toast('Recibiste: Mapa de las ruinas'); }
    else showDialog(['Aún me faltan materiales.','Vendas antiguas: ' + z.vend + '/6','Cristales de arena: ' + z.crist + '/2']);
  }
  else showDialog(z.q === 3 ? ['Las ruinas te esperan, viajero.','Sigue la flecha del mapa.'] : ['Gracias por todo, viajero.','Que la arena te sea leve.']);

function matDrop(ent){
  const z = G.dz; if(z.q !== 2) return;
  const el = ent.def === ELITE || ent.def === RELITE;
  if(z.vend < 6 && Math.random() < (el ? 0.7 : 0.45)){ z.vend++; toast('Obtuviste: Vendas antiguas (' + z.vend + '/6)'); }

function ruinsTick(){
  if(D.boss && !D.boss.alive && G.dz.q === 0) spawnNpc();

  if(tx > 84 && !D.qsOn){ D.qsOn = true; for(let y=76;y<=82;y++) for(let x=87;x<=92;x++) D.t[dIdx(x,y)] = 6; toast('¡La arena se mueve bajo tus pies!'); }
  if(tx > 93.5 && G.scene === 'desert'){ G.scene = 'fall'; G.fall = {t:0}; beep(150,0.6,'sawtooth',0.06); }
}
function updateFall(dt){
  const f = G.fall; f.t += dt;
  if(f.t > 6.5){
    G.dz.q = 4; player.hp = Math.max(player.hp, Math.ceil(player.maxHp*0.5));
    dp.x = D.ruinIn.x; dp.y = D.ruinIn.y + 50; dp.sink = 0; updateDesertCam();
    G.scene = 'desert'; registerWin(); toast('Sobreviviste a la caída... Continuará');
  }
}
function drawFall(){
  const f = G.fall;

  if(f.t > 1.6){

  if(typeof o.h !== 'string' || !/^(p:[0-9a-f]{64}|f:\d{1,10}-\d{1,10})$/.test(o.h)) return null;

    if(!ctEq(await hashPw(pw,c.s,c.h), c.h)){ noteFail(c.id); const w2 = lockLeft(c.id); return ask(w2 ? t('eLock', w2) : t('eBad')); }

    out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); tag = 'RQ1:';
  }
  let bin = ''; out.forEach(b=>{ bin += String.fromCharCode(b); });
  return tag + btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function decodePayload(raw){
  try{
    const tag = raw.slice(0,4); if(tag !== 'RQ1:' && tag !== 'RQ0:') return null;
    const bin = atob(raw.slice(4).replace(/-/g,'+').replace(/_/g,'/')); let bytes = Uint8Array.from(bin, c=> c.charCodeAt(0));
    if(tag === 'RQ1:') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const o = JSON.parse(new TextDecoder().decode(bytes)), data = {};
    for(const k in o.d) data[k] = JSON.stringify(o.d[k]);
    return {type:'riuman-account', id:encodeURIComponent(o.n.toLowerCase()), n:o.n, s:o.s, h:o.h, data:data};
  }catch(e){ return null; }
}
async function showQR(){
  const p = await encodePayload(); if(!p) return;
  const q = qrMake(p);
  if(!q){ UI.err = t('eBig'); UI.draw(); return; }
  UI.qrT = null; UI.qrH = null; UI.go('qr', qrDataURL(q, q.n > 100 ? 6 : 8));
}

async function onQR(raw){

  if(/^[A-Z0-9]{12}$/i.test(value)){ await mpScanned(value); CAM.busy = false; return; }

}

  }catch(e){ CAM.fail = true; UI.err = t('eCam'); UI.draw(); }

async function scanImage(f){
  if(!f) return;
  try{
    const r = await new BarcodeDetector({formats:['qr_code']}).detect(await createImageBitmap(f));
    const raw = r.length ? String(r[0].rawValue).trim() : '';
    if(/^[A-Z0-9]{12}$/i.test(raw)){ await mpScanned(raw); return; }
    const o = raw ? await decodePayload(raw) : null;
    if(o){ stopCam(); UI.go('qrpw', o); return; }
  }catch(e){}
  UI.err = t('eQR'); CAM.fail = true; UI.draw();
}

['mpBtn','mpWifi','mpFindId','mpFindQr','mpBt','eBt','mpMenu','mpOpen','mpWorldId','mpQrJoin','mpAnswer','mpFinish','mpWait','mpOn','mpPaste','mpJoin','mpAnsHelp','mpErr','mpCopy','mpScanAns','mpQrHelp','mpOff'].forEach((k,i)=>{ for(const l in MPTR) TR[l][k] = MPTR[l][i]; });
/* ====== MULTIJUGADOR P2P: ID corto de 12 caracteres + señalización PeerJS ====== */
const MP = {pc:null, dc:null, role:null, on:false, peer:'', offer:'', worldId:'', remote:null, lc:[], lm:[], t:0, u:0, w:0};
const MP_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const MP_OPTIONS = {
  port:443, secure:true, debug:1,
  config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}
};
function mpRandomId(){
  const bytes = new Uint8Array(12);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
  let id = '';
  for(let i=0;i<12;i++) id += MP_ALPHABET[bytes[i] % MP_ALPHABET.length];
  return id;
}
function mpWaitPeer(peer, timeout){
  return new Promise((resolve,reject)=>{
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done = true; reject(new Error('peer_timeout')); } }, timeout || 15000);
    peer.on('open', id=>{ if(done) return; done = true; clearTimeout(timer); resolve(id); });
    peer.on('error', err=>{ if(!done){ done = true; clearTimeout(timer); reject(err || new Error('peer_error')); } });
  });
}
function mpClose(){
  const dc = MP.dc, peer = MP.pc;
  MP.on = false; MP.dc = null; MP.pc = null; MP.remote = null;
  MP.role = null; MP.offer = ''; MP.worldId = ''; MP.peer = '';
  try{ if(dc) dc.close(); }catch(e){}
  try{ if(peer && !peer.destroyed) peer.destroy(); }catch(e){}
}
function mpBind(dc){
  MP.dc = dc;
  dc.on('open', ()=>{
    MP.on = true;
    if(dc.peer) MP.peer = dc.peer;
    mpOnOpen();
    if(UI.open && UI.cur === 'mphost') UI.draw();
  });
  dc.on('close', ()=>{ if(MP.on){ MP.on = false; mpOnClose(); } });
  dc.on('data', data=>{ try{ mpRecv(typeof data === 'string' ? JSON.parse(data) : data); }catch(x){} });
  dc.on('error', ()=>{ if(MP.on){ MP.on = false; mpOnClose(); } });
}
function mpSend(o){ if(MP.on && MP.dc && MP.dc.open) MP.dc.send(o); }
async function mpHost(){
  mpClose();
  if(typeof window.Peer !== 'function') throw new Error('peerjs_unavailable');
  let lastError = null;
  for(let attempt=0; attempt<4; attempt++){
    const id = mpRandomId(), peer = new Peer(id, MP_OPTIONS);
    MP.pc = peer; MP.role = 'host'; MP.worldId = id; MP.offer = id; MP.peer = '';
    peer.on('connection', conn=>{
      if(MP.dc && MP.dc.open){ conn.close(); return; }
      mpBind(conn);
    });
    try{ await mpWaitPeer(peer,15000); return id; }
    catch(e){
      lastError = e;
      try{ if(!peer.destroyed) peer.destroy(); }catch(x){}
      if(MP.pc === peer) MP.pc = null;
      if(e && e.type === 'unavailable-id') continue;
      break;
    }
  }
  MP.role = null; MP.worldId = ''; MP.offer = '';
  throw lastError || new Error('host_failed');
}
async function mpJoin(code){
  const id = String(code || '').replace(/\s+/g,'').toUpperCase();
  if(!/^[A-Z0-9]{12}$/.test(id)) throw new Error('invalid_world_id');
  mpClose();
  if(typeof window.Peer !== 'function') throw new Error('peerjs_unavailable');
  const peer = new Peer(undefined, MP_OPTIONS);
  MP.pc = peer; MP.role = 'guest'; MP.peer = id;
  await mpWaitPeer(peer,15000);
  const conn = peer.connect(id,{reliable:true,serialization:'json'});
  mpBind(conn);
  await new Promise((resolve,reject)=>{
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done = true; reject(new Error('connect_timeout')); } },20000);
    conn.on('open',()=>{ if(done) return; done = true; clearTimeout(timer); resolve(); });
    conn.on('error',err=>{ if(done) return; done = true; clearTimeout(timer); reject(err || new Error('connect_failed')); });
    peer.on('error',err=>{ if(done) return; if(err && err.type === 'peer-unavailable'){ done = true; clearTimeout(timer); reject(err); } });
  });
}

/* --- conexión con el juego: mundo compartido (muertes de momias, cofres, hora del día y posición del otro jugador) --- */
function mpOnOpen(){
  if(MP.role === 'host'){
    MP.lc = D.chests.map(c=> !!c.open); MP.lm = D.mums.map(m=> !m.alive);
    mpSend({t:'w', os:G.dz.os, diff:G.diff, mu:D.mums.map(m=> m.alive ? 1 : 0), ch:D.chests.map(c=> c.open ? 1 : 0), cl:G.dz.cl, day:G.dz.day, npc:G.dz.npc});
    toast(t('mpOn') + ' ' + MP.peer);
  }
  if(UI.open && UI.cur === 'mphost') UI.draw();
}
function mpOnClose(){ MP.remote = null; toast(t('mpOff')); if(UI.open && UI.cur === 'mphost') UI.draw(); }
function mpRecv(m){
  if(m.t === 'p'){ MP.remote = {x:+m.x || 0, y:+m.y || 0, f:m.f || 1, w:+m.w || 0, n:String(m.n || '').slice(0,16)}; }
  else if(m.t === 's'){
    (m.c || []).forEach(i=>{ if(D.chests[i]){ D.chests[i].open = true; MP.lc[i] = true; } });
    (m.m || []).forEach(i=>{ if(D.mums[i]){ D.mums[i].alive = false; MP.lm[i] = true; } });
  }
  else if(m.t === 't' && MP.role === 'guest'){
    G.dz.cl = +m.cl || 0; G.dz.day = +m.day || 1;
    if(m.npc && G.dz.q <= 1){ G.dz.npc = m.npc; if(G.dz.q === 0) G.dz.q = 1; }
  }
  else if(m.t === 'w' && MP.role === 'guest'){
    UI.close(); G.slot = 0; G.dz = defDz(); if(+m.os) G.dz.os = +m.os; G.diff = DIFF[m.diff] ? m.diff : 'med'; resetGame();
    (m.mu || []).forEach((a,i)=>{ if(D.mums[i]) D.mums[i].alive = !!a; });
    (m.ch || []).forEach((o,i)=>{ if(D.chests[i]) D.chests[i].open = !!o; });
    G.dz.cl = +m.cl || 0; G.dz.day = +m.day || 1; if(m.npc){ G.dz.npc = m.npc; G.dz.q = 1; }
    MP.lc = D.chests.map(c=> !!c.open); MP.lm = D.mums.map(x=> !x.alive); G.scene = 'desert';
  }
}
function mpTick(dt){
  if(!MP.on) return;
  MP.t += dt; if(MP.t >= 0.1){ MP.t = 0; mpSend({t:'p', x:Math.round(dp.x), y:Math.round(dp.y), f:dp.f, w:dp.walk, n:ACC.name}); }
  MP.u += dt;
  if(MP.u >= 0.5){
    MP.u = 0; const c = [], m = [];
    D.chests.forEach((o,i)=>{ if(o.open && !MP.lc[i]){ MP.lc[i] = true; c.push(i); } });
    D.mums.forEach((o,i)=>{ if(!o.alive && !MP.lm[i]){ MP.lm[i] = true; m.push(i); } });
    if(c.length || m.length) mpSend({t:'s', c:c, m:m});
  }
  if(MP.role === 'host'){ MP.w += dt; if(MP.w >= 2){ MP.w = 0; mpSend({t:'t', cl:G.dz.cl, day:G.dz.day, npc:G.dz.npc}); } }
}
function drawRemote(){
  const r = MP.remote; if(!MP.on || !r) return;
  ctx.save(); ctx.globalAlpha = 0.85; drawPlayerAt(r.x-13,r.y-34,r.f,r.w,false); ctx.restore();
  txt(r.n || '?',r.x,r.y-52,11,'#7dd3fc','center');
}
async function mpOpen(){ try{ UI.err = ''; await mpHost(); }catch(e){ UI.err = t('mpErr'); mpClose(); } UI.draw(); }
async function mpJoinFlow(code){
  try{ await mpJoin(String(code).trim()); UI.go('mphost'); }
  catch(e){ mpClose(); UI.err = t('mpErr'); UI.draw(); }
}
function showOfferQR(){
  const q = qrMake(MP.worldId);
  if(!q){ UI.err = t('eBig'); UI.draw(); return; }
  UI.qrT = 'mpWorldId'; UI.qrH = 'mpQrHelp'; UI.go('qr', qrDataURL(q, 8));
}
async function mpScanned(raw){
  const id = String(raw || '').trim().toUpperCase();
  if(!/^[A-Z0-9]{12}$/.test(id)) return;
  stopCam(); await mpJoinFlow(id);
}

/* ---------------- BUCLE PRINCIPAL ---------------- */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  acc += dt; G.t += dt; tick(dt); musicTick(); try{ padTick(); }catch(e){ PAD.dead = true; }
  while(acc >= 1/60){ update(1/60); acc -= 1/60; }
  draw();
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);

<script>
/* Controles táctiles: stick + Z X C (envían las mismas teclas del juego) */
(function(){
  if(!(('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return;
  document.getElementById('hint').style.display = 'none';
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  const st = document.createElement('style');
  st.textContent = '.tc{position:fixed;z-index:9;user-select:none;-webkit-user-select:none;touch-action:none}'
   + '#stk{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}'
   + '#knob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}'
   + '.btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;font:bold 24px "Courier New",monospace;display:flex;align-items:center;justify-content:center}';
  document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend',
    '<div id="stk" class="tc"><div id="knob"></div></div>'
   + '<div class="tc btn" id="bz" style="right:22px;bottom:94px">Z</div>'
   + '<div class="tc btn" id="bx" style="right:98px;bottom:56px">X</div>'
   + '<div class="tc btn" id="bc" style="right:22px;bottom:20px">C</div>');
  const down = {};
  function press(c,on){
    if(!!down[c] === on) return; down[c] = on;
    window.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup',{code:c,bubbles:true,cancelable:true}));
  }
  const stk = document.getElementById('stk'), knob = document.getElementById('knob');
  const DIRS = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  let sid = null;
  function mv(e){
    const r = stk.getBoundingClientRect(), R = r.width/2;
    let dx = e.clientX-(r.left+R), dy = e.clientY-(r.top+R);
    const m = Math.hypot(dx,dy); if(m > R){ dx *= R/m; dy *= R/m; }
    knob.style.transform = 'translate('+dx+'px,'+dy+'px)';
    const t = R*0.35;
    press('ArrowLeft',dx < -t); press('ArrowRight',dx > t); press('ArrowUp',dy < -t); press('ArrowDown',dy > t);
  }
  function rel(){ sid = null; knob.style.transform = ''; DIRS.forEach(function(c){ press(c,false); }); }
  stk.addEventListener('pointerdown',function(e){ sid = e.pointerId; stk.setPointerCapture(sid); mv(e); e.preventDefault(); });
  stk.addEventListener('pointermove',function(e){ if(e.pointerId === sid) mv(e); });
  stk.addEventListener('pointerup',rel); stk.addEventListener('pointercancel',rel);
  [['bz','KeyZ'],['bx','KeyX'],['bc','KeyC']].forEach(function(b){
    const el = document.getElementById(b[0]);
    el.addEventListener('pointerdown',function(e){ press(b[1],true); e.preventDefault(); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(n){ el.addEventListener(n,function(){ press(b[1],false); }); });
  });
})();
</script>
